name: 시세 갱신

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 (한국 시간)
  workflow_dispatch: # Actions 탭에서 직접 실행

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 계산 테스트
        run: npm test

      - name: 시세 읽기
        run: node crawler/crawl.mjs

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없습니다"
          else
            git commit -m "시세 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

name: 시세 갱신

on:
  schedule:
    - cron: '50 11 * * *' # 임시 시험: 20:50 (한국 시간). 확인 후 지울 것
    - cron: '23 21,3,11 * * *' # 매일 06:23, 12:23, 20:23쯤 (한국 시간). 정각은 GitHub가 몰려서 건너뛰는 일이 있어 피했다
  workflow_dispatch: # Actions 탭에서 직접 실행
  push: # 페이지나 설정을 고치면 바로 다시 만들어 올린다
    branches: [main]
    paths:
      - 'site/**'
      - 'config/**'
      - 'crawler/**'

permissions:
  contents: read

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 계산 테스트
        run: npm test

      - name: 시세 읽기
        run: node crawler/crawl.mjs

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없습니다"
          else
            git commit -m "시세 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

  # 시세를 읽어 저장한 뒤 웹페이지를 GitHub Pages에 올린다.
  # 저장소 설정 > Pages > Source 를 'GitHub Actions'로 바꿔 두어야 한다.
  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 방금 저장한 최신 데이터를 받는다

      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp site/index.html _site/index.html
          cp site/recommend.js _site/recommend.js

      - name: 마진표 암호화
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node crawler/encrypt.mjs data _site/margin.enc.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
